<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalper Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; font-size: 24px; }
        h2 { color: #8b949e; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group input[type="number"] {
            width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #c9d1d9; font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: #58a6ff; }
        
        .checkbox-group { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #238636; color: white; }
        .btn-primary:hover { background: #2ea043; }
        .btn-danger { background: #da3633; color: white; }
        .btn-danger:hover { background: #f85149; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        
        .process-list { margin-top: 10px; }
        .process-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .process-info { flex: 1; }
        .process-ticker { font-weight: 600; color: #58a6ff; font-size: 16px; }
        .process-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .process-actions { display: flex; gap: 8px; }
        
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge-live { background: #da3633; color: white; }
        .badge-dry { background: #388bfd; color: white; }
        .badge-llm { background: #a371f7; color: white; }
        
        .log-container { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; height: 400px; overflow-y: auto; font-family: 'SF Mono', Consolas, monospace; font-size: 12px; padding: 12px; }
        .log-line { padding: 2px 0; white-space: pre-wrap; word-break: break-all; }
        .log-line:nth-child(odd) { background: rgba(255,255,255,0.02); }
        
        .state-list { margin-top: 10px; }
        .state-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
        .state-ticker { font-weight: 600; color: #f0883e; }
        .state-detail { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .state-profit { color: #3fb950; }
        .state-loss { color: #f85149; }
        
        .empty-state { color: #484f58; font-size: 13px; padding: 20px; text-align: center; }
        
        .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .refresh-bar span { font-size: 11px; color: #484f58; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scalper Dashboard</h1>
        
        <div class="grid">
            <div class="card">
                <h2>New Scalper</h2>
                <form id="startForm">
                    <div class="form-group">
                        <label>Ticker (종목코드 or 종목명)</label>
                        <input type="text" id="ticker" placeholder="014940 or 삼성전자" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label>Budget (원)</label>
                            <input type="number" id="budget" value="1000000" min="10000">
                        </div>
                        <div class="form-group">
                            <label>Target Profit (%)</label>
                            <input type="number" id="target" value="0.5" step="0.1" min="0.1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Manual Buy Price (optional)</label>
                        <input type="number" id="buyPrice" value="0" min="0">
                    </div>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="liveMode"> Live Mode</label>
                        <label><input type="checkbox" id="llmMode"> LLM (GPT)</label>
                        <label><input type="checkbox" id="orderbook"> Orderbook Filter</label>
                        <label><input type="checkbox" id="momentum"> Momentum Mode</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Start Scalper</button>
                </form>
            </div>
            
            <div class="card">
                <div class="refresh-bar">
                    <h2>Running Processes</h2>
                    <span id="lastUpdate">-</span>
                </div>
                <div id="processList" class="process-list">
                    <div class="empty-state">No running processes</div>
                </div>
            </div>
        </div>
        
        <div class="grid" style="margin-top: 20px;">
            <div class="card">
                <h2>Saved States (Positions)</h2>
                <div id="stateList" class="state-list">
                    <div class="empty-state">No saved states</div>
                </div>
            </div>
            
            <div class="card">
                <div class="refresh-bar">
                    <h2>Live Logs</h2>
                    <select id="logTicker" class="btn btn-secondary" style="padding: 4px 8px;">
                        <option value="">Select ticker...</option>
                    </select>
                </div>
                <div id="logContainer" class="log-container">
                    <div class="empty-state">Select a running process to view logs</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        
        async function fetchStatus() {
            try {
                const res = await fetch('/api/scalper/status');
                const data = await res.json();
                renderProcesses(data.processes);
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (e) {
                console.error('Failed to fetch status:', e);
            }
        }
        
        async function fetchStates() {
            try {
                const res = await fetch('/api/scalper/states');
                const data = await res.json();
                renderStates(data.states);
            } catch (e) {
                console.error('Failed to fetch states:', e);
            }
        }
        
        function renderProcesses(processes) {
            const container = document.getElementById('processList');
            const select = document.getElementById('logTicker');
            
            if (!processes.length) {
                container.innerHTML = '<div class="empty-state">No running processes</div>';
                select.innerHTML = '<option value="">Select ticker...</option>';
                return;
            }
            
            container.innerHTML = processes.map(p => `
                <div class="process-item">
                    <div class="process-info">
                        <div class="process-ticker">
                            ${p.ticker}
                            ${p.live_mode ? '<span class="badge badge-live">LIVE</span>' : '<span class="badge badge-dry">DRY</span>'}
                            ${p.llm_mode ? '<span class="badge badge-llm">LLM</span>' : ''}
                        </div>
                        <div class="process-meta">
                            PID: ${p.pid} | Budget: ${p.budget.toLocaleString()}원 | Uptime: ${formatUptime(p.uptime_seconds)}
                        </div>
                    </div>
                    <div class="process-actions">
                        <button class="btn btn-secondary" onclick="viewLogs('${p.ticker}')">Logs</button>
                        <button class="btn btn-danger" onclick="stopScalper('${p.ticker}')">Stop</button>
                    </div>
                </div>
            `).join('');
            
            select.innerHTML = '<option value="">Select ticker...</option>' + 
                processes.map(p => `<option value="${p.ticker}">${p.ticker}</option>`).join('');
        }
        
        function renderStates(states) {
            const container = document.getElementById('stateList');
            
            if (!states.length) {
                container.innerHTML = '<div class="empty-state">No saved states</div>';
                return;
            }
            
            container.innerHTML = states.map(s => {
                const profitClass = s.daily_realized_profit >= 0 ? 'state-profit' : 'state-loss';
                return `
                    <div class="state-item">
                        <div class="state-ticker">${s.ticker} - ${s.state}</div>
                        <div class="state-detail">
                            Avg: ${s.avg_buy_price?.toLocaleString() || 0}원 | 
                            Qty: ${s.total_qty || 0}주 | 
                            Step: ${s.current_step || 0} |
                            <span class="${profitClass}">Daily P&L: ${(s.daily_realized_profit || 0).toLocaleString()}원</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function formatUptime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }
        
        async function stopScalper(ticker) {
            if (!confirm(`Stop scalper for ${ticker}?`)) return;
            
            try {
                const res = await fetch(`/api/scalper/stop/${ticker}`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || 'Failed to stop');
                    return;
                }
                fetchStatus();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function viewLogs(ticker) {
            document.getElementById('logTicker').value = ticker;
            connectWebSocket(ticker);
        }
        
        function connectWebSocket(ticker) {
            if (ws) {
                ws.close();
            }
            
            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            
            if (!ticker) {
                container.innerHTML = '<div class="empty-state">Select a running process to view logs</div>';
                return;
            }
            
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/logs/${ticker}`);
            
            ws.onmessage = (event) => {
                const line = document.createElement('div');
                line.className = 'log-line';
                line.textContent = event.data;
                container.appendChild(line);
                container.scrollTop = container.scrollHeight;
            };
            
            ws.onclose = () => {
                const line = document.createElement('div');
                line.className = 'log-line';
                line.textContent = '[WebSocket disconnected]';
                line.style.color = '#f85149';
                container.appendChild(line);
            };
        }
        
        document.getElementById('startForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                ticker: document.getElementById('ticker').value,
                budget: parseFloat(document.getElementById('budget').value),
                target: parseFloat(document.getElementById('target').value) / 100,
                buy_price: parseFloat(document.getElementById('buyPrice').value) || 0,
                live_mode: document.getElementById('liveMode').checked,
                llm_mode: document.getElementById('llmMode').checked,
                orderbook: document.getElementById('orderbook').checked,
                momentum: document.getElementById('momentum').checked,
            };
            
            try {
                const res = await fetch('/api/scalper/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || 'Failed to start');
                    return;
                }
                
                document.getElementById('ticker').value = '';
                fetchStatus();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        });
        
        document.getElementById('logTicker').addEventListener('change', (e) => {
            connectWebSocket(e.target.value);
        });
        
        fetchStatus();
        fetchStates();
        setInterval(fetchStatus, 5000);
        setInterval(fetchStates, 10000);
    </script>
</body>
</html>
