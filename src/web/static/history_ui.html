        <!-- History Tool Panel -->
        <div id="panel-history" class="hidden">
            <div class="grid md:grid-cols-4 gap-6">
                <!-- Control Panel -->
                <div class="glass rounded-lg p-5 border border-dark-600 md:col-span-1 h-fit">
                    <h2 class="text-sm font-semibold text-gray-400 mb-4" data-i18n="history_settings">History Settings</h2>
                    <form id="historyForm" class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1" data-i18n="ticker">Ticker</label>
                            <input type="text" id="histTicker" required class="w-full px-3 py-2 bg-dark-900 border border-dark-600 rounded-md text-white focus:border-accent-blue focus:outline-none placeholder-gray-600" placeholder="e.g. 005930">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1" data-i18n="start_date">Start Date</label>
                                <input type="text" id="histStart" class="w-full px-3 py-2 bg-dark-900 border border-dark-600 rounded-md text-white focus:border-accent-blue focus:outline-none text-xs" placeholder="YYYYMMDD">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1" data-i18n="end_date">End Date</label>
                                <input type="text" id="histEnd" class="w-full px-3 py-2 bg-dark-900 border border-dark-600 rounded-md text-white focus:border-accent-blue focus:outline-none text-xs" placeholder="YYYYMMDD">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1" data-i18n="timeframe">Timeframe</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="cursor-pointer">
                                    <input type="radio" name="histTimeframe" value="D" checked class="peer sr-only">
                                    <div class="text-center py-2 bg-dark-800 peer-checked:bg-accent-blue peer-checked:text-white rounded text-xs transition">Daily</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="histTimeframe" value="W" class="peer sr-only">
                                    <div class="text-center py-2 bg-dark-800 peer-checked:bg-accent-blue peer-checked:text-white rounded text-xs transition">Weekly</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="histTimeframe" value="M" class="peer sr-only">
                                    <div class="text-center py-2 bg-dark-800 peer-checked:bg-accent-blue peer-checked:text-white rounded text-xs transition">Monthly</div>
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="w-full py-2 bg-accent-blue hover:bg-blue-600 text-white font-medium rounded-md transition mt-2">
                            <span id="histBtnText" data-i18n="collect_data">Collect Data</span>
                        </button>
                        <!-- Human Index Collection Button -->
                        <div class="flex gap-2 mt-2">
                            <div class="w-24 flex items-center bg-dark-900 border border-dark-600 rounded-md px-2">
                                <input type="number" id="histHumanDays" value="60" min="1" max="365" class="w-full bg-transparent text-white text-sm text-center focus:outline-none" placeholder="60">
                                <span class="text-xs text-gray-500">days</span>
                            </div>
                            <button type="button" id="btnCollectHuman" class="flex-1 py-2 bg-accent-purple hover:bg-purple-600 text-white font-medium rounded-md transition">
                                <span id="humanBtnText" data-i18n="collect_human_index">Collect Human Index</span>
                            </button>
                        </div>
                        
                        <!-- Log Area -->
                        <div class="mt-4">
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs text-gray-500">Collection Logs</label>
                                <button type="button" id="btnClearHistoryLogs" class="text-xs text-gray-600 hover:text-white">Clear</button>
                            </div>
                            <div id="historyLogs" class="h-32 bg-dark-900 rounded border border-dark-700 p-2 text-xs font-mono overflow-y-auto scrollbar-thin">
                                <div class="text-gray-600 italic text-center py-10">Logs will appear here...</div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Results Panel -->
                <div class="glass rounded-lg p-5 border border-dark-600 md:col-span-3 min-h-[500px]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-semibold text-gray-400" data-i18n="collected_data">Collected Data</h2>
                        <span id="histCount" class="text-xs text-accent-blue"></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-gray-500 uppercase bg-dark-800">
                                <tr>
                                    <th class="px-4 py-3">Date</th>
                                    <th class="px-4 py-3 text-right">Open</th>
                                    <th class="px-4 py-3 text-right">High</th>
                                    <th class="px-4 py-3 text-right">Low</th>
                                    <th class="px-4 py-3 text-right">Close</th>
                                    <th class="px-4 py-3 text-right">Volume</th>
                                </tr>
                            </thead>
                            <tbody id="histTableBody" class="divide-y divide-dark-700">
                                <tr><td colspan="6" class="px-4 py-8 text-center text-gray-600" data-i18n="no_data">No data loaded</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
