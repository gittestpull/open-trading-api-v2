version: "3.8"

services:
  trading-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: trading-web
    restart: unless-stopped
    ports:

      - "${WEB_PORT:-30800}:8080"
    volumes:
      # KIS API config (required)
      - ./kis_devlp.yaml:/app/kis_devlp.yaml:ro
      # Logs directory (persist logs)
      - ./logs:/app/logs:rw
      # State data (persist trading state)
      - ./scalp_data:/app/scalp_data:rw
      # Trade history (SQLite DB)
      - ./data:/app/data:rw
      # Bot config (persist added bots)
      - ./web/bots_config.json:/app/web/bots_config.json:rw
      # Blocked IPs (persist security state)
      - ./web/blocked_ips.json:/app/web/blocked_ips.json:rw
    environment:
      - TZ=Asia/Seoul
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-trading123}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
