version: "3.8"

services:
  trading-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-web:${ENV_TYPE:-prod}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-30800}:8080"
    volumes:
      # KIS API config (shared)
      - ./kis_devlp.yaml:/app/kis_devlp.yaml:ro
      # Logs directory (environment-specific isolation)
      - ./logs/${ENV_TYPE:-prod}:/app/logs:rw
      # State data (environment-specific isolation)
      - ./scalp_data/${ENV_TYPE:-prod}:/app/scalp_data:rw
      # Trade history (environment-specific isolation)
      - ./data/${ENV_TYPE:-prod}:/app/data:rw
      # Bot config (environment-specific isolation)
      - ./web/config/${ENV_TYPE:-prod}/bots_config.json:/app/web/bots_config.json:rw
      # Blocked IPs (environment-specific isolation)
      - ./web/config/${ENV_TYPE:-prod}/blocked_ips.json:/app/web/blocked_ips.json:rw
      # === DEV ONLY: 소스 코드 실시간 반영 ===
      # web/ 디렉토리 마운트 (프론트엔드 + 백엔드)
      - ./web:/app/web:rw
      # Python 모듈 마운트 (소스 수정 즉시 반영)
      # Python 모듈 마운트 (소스 수정 즉시 반영)
      - ./src/services/stock_cache.py:/app/src/services/stock_cache.py:rw
      - ./src/services/stock_screener.py:/app/src/services/stock_screener.py:rw
      - ./src/services/stock_master:/app/src/services/stock_master:rw
      - ./src/scalper/core_universal.py:/app/src/scalper/core_universal.py:rw
      - ./src/api:/app/src/api:rw
      - ./src/web/static:/app/src/web/static:rw
      - ./tools:/app/tools:rw

    environment:
      - TZ=Asia/Seoul
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-trading123}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PUBLIC_IP=${PUBLIC_IP}
      - WEB_PORT=${WEB_PORT:-8080}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  trading-staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-web:staging
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./kis_devlp.yaml:/app/kis_devlp.yaml:ro
      - ./logs/staging:/app/logs:rw
      - ./scalp_data/staging:/app/scalp_data:rw
      - ./data/staging:/app/data:rw
      - ./web/config/staging/bots_config.json:/app/web/bots_config.json:rw
      - ./web/config/staging/blocked_ips.json:/app/web/blocked_ips.json:rw
    environment:
      - TZ=Asia/Seoul
      - ENV_TYPE=staging
      - WEB_PORT=8082
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-trading123}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3


