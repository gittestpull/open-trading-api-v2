<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Dashboard</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Paperlogy:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content login-box">
            <h2>🔐 Trading Bot Dashboard</h2>
            <p>비밀번호를 입력하세요</p>
            <input type="password" id="passwordInput" placeholder="Password"
                onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">로그인</button>
            <p id="loginError" class="error"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <header>
            <h1>📈 Trading Bot Dashboard</h1>
            <div class="header-actions">
                <span id="connectionStatus" class="status-dot disconnected"></span>
                <button onclick="showAddBotModal()" class="btn-primary">+ 봇 추가</button>
            </div>
        </header>

        <main>
            <!-- Bot Cards Container -->
            <div id="botCards" class="bot-cards">
                <div class="empty-state" id="emptyState">
                    <p>등록된 봇이 없습니다</p>
                    <button onclick="showAddBotModal()">첫 번째 봇 추가하기</button>
                </div>
            </div>

            <!-- Log Viewer -->
            <div class="log-section">
                <div class="log-header">
                    <h3 id="logHeaderTitle">📋 로그</h3>
                    <button onclick="refreshLogs()" class="btn-small">새로고침</button>
                </div>
                <div id="logViewer" class="log-viewer">
                    <p class="log-placeholder">봇을 시작하면 로그가 표시됩니다...</p>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p>Trading Bot Dashboard v1.2 | <span id="currentTime"></span></p>
                <button onclick="showSecurityModal()" class="btn-text">🛡️ 보안 관리</button>
            </div>
        </footer>
    </div>

    <!-- Add Bot Modal -->
    <div id="addBotModal" class="modal hidden">
        <div class="modal-content">
            <h2>봇 추가</h2>
            <form onsubmit="addBot(event)">
                <div class="form-group">
                    <label>종목명 또는 종목코드</label>
                    <input type="text" id="tickerInput" placeholder="예: 오리엔탈정공 또는 014940" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>투자 예산 (원)</label>
                        <input type="number" id="budgetInput" placeholder="1300000" value="1300000" required>
                    </div>
                    <div class="form-group">
                        <label>목표 수익률 (%)</label>
                        <input type="number" id="targetInput" placeholder="2" value="2" step="any" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>수동 매수 가격 (0 = 즉시시장가)</label>
                    <input type="number" id="buyPriceInput" placeholder="0" value="0">
                    <small class="hint">0이면 즉시 시장가 매수 시작</small>
                </div>

                <div class="options-group">
                    <div class="form-group checkbox">
                        <input type="checkbox" id="orderbookInput">
                        <label for="orderbookInput">호가 잔량 필터 (매수잔량 > 매도잔량)</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="momentumInput">
                        <label for="momentumInput">모멘텀 모드 (돌파 매매)</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="ignoreMarketInput">
                        <label for="ignoreMarketInput">장외 시간 무시 (24시간 가동)</label>
                    </div>
                </div>

                <div class="form-group checkbox live-box">
                    <input type="checkbox" id="liveInput" checked>
                    <label for="liveInput">🚨 실제 매매 (Live Mode)</label>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="hideAddBotModal()" class="btn-secondary">취소</button>
                    <button type="submit" class="btn-primary">추가</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Bot Modal -->
    <div id="editBotModal" class="modal hidden">
        <div class="modal-content">
            <h2>봇 설정 수정</h2>

            <form onsubmit="updateBot(event)">
                <input type="hidden" id="editBotId">
                <div class="form-group">
                    <label>종목</label>
                    <input type="text" id="editTickerInput" disabled class="disabled-input">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>투자 예산 (원)</label>
                        <input type="number" id="editBudgetInput" required>
                    </div>
                    <div class="form-group">
                        <label>목표 수익률 (%)</label>
                        <input type="number" id="editTargetInput" step="any" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>수동 매수 가격</label>
                    <input type="number" id="editBuyPriceInput">
                </div>

                <div class="options-group">
                    <div class="form-group checkbox">
                        <input type="checkbox" id="editOrderbookInput">
                        <label for="editOrderbookInput">호가 잔량 필터</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="editMomentumInput">
                        <label for="editMomentumInput">모멘텀 모드</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="editIgnoreMarketInput">
                        <label for="editIgnoreMarketInput">장외 시간 무시</label>
                    </div>
                </div>

                <div class="form-group checkbox live-box">
                    <input type="checkbox" id="editLiveInput">
                    <label for="editLiveInput">🚨 실제 매매 (Live Mode)</label>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="hideEditBotModal()" class="btn-secondary">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Security Modal -->
    <div id="securityModal" class="modal hidden">
        <div class="modal-content">
            <h2>🛡️ 차단된 IP 관리</h2>
            <div id="blockedIpList" class="ip-list">
                <p class="placeholder-text">차단된 IP가 없습니다.</p>
            </div>

            <hr class="divider">
            <div class="danger-zone">
                <h3>🚨 Danger Zone</h3>
                <p class="warning-text">모든 봇을 중지하고, 보유 주식을 전량 매도하며, 데이터를 초기화합니다.</p>
                <button onclick="emergencyReset()" class="btn-danger-block">⚠️ 전체 매도 및 초기화</button>
            </div>

            <div class="form-actions">
                <button type="button" onclick="hideSecurityModal()" class="btn-secondary">닫기</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js?v=4"></script>
</body>

</html>
