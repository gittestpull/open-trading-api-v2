[project]
name = "kis-github"
version = "1.0.0"
description = "korea investment open api sample codes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.1",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.23.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "websockets>=15.0.1",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
