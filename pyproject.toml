[project]
name = "kis-github"
version = "1.0.0"
description = "korea investment open api sample codes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.1",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.23.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "websockets>=15.0.1",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.14.3",
    "google-api-python-client>=2.187.0",
    "pytz>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # line too long (handled by line-length)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"legacy/*" = ["E", "F", "W", "B", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = false
